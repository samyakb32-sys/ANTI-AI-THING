<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Assignment Rewriter</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 800px;
    margin: 40px auto;
    padding: 0 16px;
    background: #f7f7f8;
    color: #1a1a1a;
  }
  h1 { font-size: 1.5rem; }
  .note {
    font-size: 0.9rem;
    color: #555;
    background: #fff9db;
    border: 1px solid #f0e4a0;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 20px;
  }
  textarea {
    width: 100%;
    min-height: 200px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 1rem;
    box-sizing: border-box;
    font-family: inherit;
  }
  .row { display: flex; gap: 12px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
  select, button, input[type=file] { font-size: 1rem; padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; }
  button {
    background: #2563eb;
    color: white;
    border: none;
    cursor: pointer;
  }
  button:disabled { background: #93b4ec; cursor: not-allowed; }
  #output {
    white-space: pre-wrap;
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px;
    min-height: 100px;
    margin-top: 12px;
  }
  #error { color: #b00020; margin-top: 8px; }
</style>
</head>
<body>
  <h1>Assignment Rewriter</h1>
  <div class="note">
    For rewriting your own drafts into your own natural voice — keeps facts and structure intact.
    Always follow your school/institution's academic integrity policy on AI-assisted work.
  </div>

  <div class="row">
    <input type="file" id="fileInput" accept=".txt,.md,.docx,.pdf" />
    <span>or paste text below</span>
  </div>

  <textarea id="textInput" placeholder="Paste your assignment draft here..."></textarea>

  <div class="row">
    <label for="tone">Tone:</label>
    <select id="tone">
      <option value="casual">Casual / conversational</option>
      <option value="formal">Formal but natural</option>
      <option value="simple">Simple / plain</option>
    </select>
    <button id="rewriteBtn">Rewrite</button>
  </div>

  <div id="error"></div>
  <h3>Result</h3>
  <div id="output"></div>

  <script>
    const btn = document.getElementById('rewriteBtn');
    const output = document.getElementById('output');
    const errorEl = document.getElementById('error');

    btn.addEventListener('click', async () => {
      errorEl.textContent = '';
      output.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Rewriting...';

      try {
        const fileInput = document.getElementById('fileInput');
        const tone = document.getElementById('tone').value;
        let res;

        if (fileInput.files.length > 0) {
          const formData = new FormData();
          formData.append('file', fileInput.files[0]);
          formData.append('tone', tone);
          res = await fetch('/api/rewrite', { method: 'POST', body: formData });
        } else {
          const text = document.getElementById('textInput').value;
          res = await fetch('/api/rewrite', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, tone }),
          });
        }

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed.');
        output.textContent = data.rewritten;
      } catch (err) {
        errorEl.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Rewrite';
      }
    });
  </script>
</body>
</html>
